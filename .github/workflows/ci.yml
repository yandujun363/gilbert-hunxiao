name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 单元测试 + CLI 往返
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 零依赖：不跑 npm install 也能过
      - name: 单元测试
        run: node --test test/

      - name: CLI 自检
        run: node ci/cli.mjs selftest

      - name: CLI 端到端（顺序表编码 → 解码，像素必须逐字节相同）
        run: |
          node ci/make-fixture.mjs /tmp/fixture.png 128 96
          node ci/cli.mjs encode /tmp/fixture.png /tmp/enc.png --table "[1,-3,4,7,-5,7]"
          node ci/cli.mjs decode /tmp/enc.png /tmp/back.png --table "[1,-3,4,7,-5,7]"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { decodePng } from './src/core/png.js';
            const a = decodePng(fs.readFileSync('/tmp/fixture.png')).data;
            const b = decodePng(fs.readFileSync('/tmp/back.png')).data;
            let d = 0;
            for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++;
            if (d) { console.error('往返差异字节数:', d); process.exit(1); }
            console.log('往返逐字节相同 ✔');
          "

      - name: Python 版本自检（零依赖）
        run: |
          python3 ci/py/gilbert_cli.py selftest
          python3 ci/py/gilbert_cli.py encode /tmp/fixture.png /tmp/py_enc.png --table "[1,-3,4,7,-5,7]"
          python3 ci/py/gilbert_cli.py decode /tmp/py_enc.png /tmp/py_back.png --table "[1,-3,4,7,-5,7]"
          python3 --version

      - name: 超大图必须被拒绝（退出码 1）
        run: |
          node ci/make-fixture.mjs /tmp/big.png 400 400
          if node ci/cli.mjs encode /tmp/big.png /tmp/x.png --max-mp 0.01; then
            echo "应该报错却成功了"; exit 1
          else
            echo "已按预期拒绝 ✔"
          fi

      - name: 性能基准（1MP，不卡 CI）
        run: node ci/bench.mjs --sizes 1
